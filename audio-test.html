<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>365 療癒音效測試</title>

<style>
body {
    font-family: sans-serif;
    padding: 30px;
    line-height: 1.8;
}

button {
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
}

#status {
    padding: 15px;
    background: #f5f5f5;
    border-radius: 10px;
}
</style>

</head>

<body>

<h2>🎧 365 療癒音效測試</h2>

<div id="status">
等待播放...
</div>

<h3>單一音效</h3>

<button onclick="playSound('smallWaves')">
🌊 小海浪
</button>

<button onclick="playSound('rain')">
🌧️ 細雨
</button>

<button onclick="playSound('forestBirds')">
🐦 森林鳥鳴
</button>

<button onclick="playSound('crickets')">
🦗 蟋蟀
</button>

<button onclick="playSound('fire')">
🔥 柴火
</button>

<h3>混音測試</h3>

<button onclick="playSummerNight()">
🌙 夏夜聲景
</button>

<button onclick="playSpring()">
🌱 春季聲景
</button>

<button onclick="playWinter()">
❄️ 冬季聲景
</button>

<br><br>

<button onclick="stopAll()">
⏹ 停止所有聲音
</button>


<script>

const R2_BASE =
"https://pub-a2859f8c83524448bc30ea83e308bc1a.r2.dev/";

const SOUND_LIBRARY = {

    smallWaves: {
        name: "小海浪",
        file: "小海浪.mp3"
    },

    rain: {
        name: "細雨",
        file: "細雨.mp3"
    },

    forestBirds: {
        name: "森林鳥鳴",
        file: "森林鳥鳴.mp3"
    },

    crickets: {
        name: "蟋蟀",
        file: "蟋蟀.mp3"
    },

    fire: {
        name: "柴火",
        file: "柴火.mp3"
    },

    softWind: {
        name: "柔風",
        file: "柔風.mp3"
    },

    river: {
        name: "河水",
        file: "河水.mp3"
    },

    summerNight: {
        name: "夏夜蟲鳴與蛙鳴",
        file: "夏夜蟲鳴與蛙鳴.mp3"
    }

};


function getAudioUrl(file) {

    return R2_BASE +
        encodeURIComponent(file);

}


let activeAudio = [];


function createTrack(soundKey, volume = 0.5) {

    const sound =
        SOUND_LIBRARY[soundKey];

    if (!sound) return null;

    const audio =
        new Audio(
            getAudioUrl(sound.file)
        );

    audio.loop = true;

    audio.volume =
        Math.max(
            0,
            Math.min(1, volume)
        );

    return audio;

}


async function playSound(soundKey) {

    stopAll();

    const sound =
        SOUND_LIBRARY[soundKey];

    if (!sound) return;

    const audio =
        createTrack(
            soundKey,
            0.5
        );

    activeAudio.push(audio);

    try {

        await audio.play();

        document.getElementById(
            "status"
        ).innerHTML =
            "✅ 正在播放：" +
            sound.name;

    }

    catch(error) {

        document.getElementById(
            "status"
        ).innerHTML =
            "❌ 播放失敗：" +
            error.message;

        console.error(error);

    }

}


/* 🌙 夏夜 */

async function playSummerNight() {

    stopAll();

    const tracks = [

        createTrack(
            "summerNight",
            0.45
        ),

        createTrack(
            "softWind",
            0.15
        ),

        createTrack(
            "river",
            0.15
        )

    ];

    activeAudio =
        tracks.filter(Boolean);

    try {

        await Promise.all(
            activeAudio.map(
                audio =>
                    audio.play()
            )
        );

        document.getElementById(
            "status"
        ).innerHTML =
            "🌙 夏夜聲景播放中<br>" +
            "蟲鳴蛙鳴 45% + 柔風 15% + 河水 15%";

    }

    catch(error) {

        console.error(error);

    }

}


/* 🌱 春季 */

async function playSpring() {

    stopAll();

    const tracks = [

        createTrack(
            "forestBirds",
            0.40
        ),

        createTrack(
            "river",
            0.20
        ),

        createTrack(
            "softWind",
            0.15
        )

    ];

    activeAudio =
        tracks.filter(Boolean);

    await Promise.all(
        activeAudio.map(
            audio =>
                audio.play()
        )
    );

    document.getElementById(
        "status"
    ).innerHTML =
        "🌱 春季聲景播放中<br>" +
        "森林鳥鳴 40% + 河水 20% + 柔風 15%";

}


/* ❄️ 冬季 */

async function playWinter() {

    stopAll();

    const tracks = [

        createTrack(
            "fire",
            0.45
        ),

        createTrack(
            "softWind",
            0.12
        )

    ];

    activeAudio =
        tracks.filter(Boolean);

    await Promise.all(
        activeAudio.map(
            audio =>
                audio.play()
        )
    );

    document.getElementById(
        "status"
    ).innerHTML =
        "❄️ 冬季聲景播放中<br>" +
        "柴火 45% + 柔風 12%";

}


/* 停止全部 */

function stopAll() {

    activeAudio.forEach(
        audio => {

            audio.pause();

            audio.currentTime = 0;

        }
    );

    activeAudio = [];

    document.getElementById(
        "status"
    ).innerHTML =
        "⏹ 已停止所有音效";

}

</script>

</body>
</html>
